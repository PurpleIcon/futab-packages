# Shellcheck, the sign-off check, and the repositories built, signed and
# installed from with made-up packages and a throwaway key. The final job,
# ci-success, passes only if every other job passed.
#
# Based on oxiguitar-packages' .github/workflows/ci.yml
# (mateusrdp/oxiguitar-packages@070d367), without its Rust, release and
# winget jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh

  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: >-
          scripts/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  repositories:
    name: Repositories (build, sign, install)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm gnupg flatpak ostree
      # The key has a passphrase, as the real one does, so its path through
      # gpg, rpmsign and gpg-agent (for Flatpak) is tested too.
      - name: Test packages, a throwaway key and the site
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf 'throwaway' > "$RUNNER_TEMP/passphrase"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --quick-generate-key 'FuTab CI (throwaway)' rsa4096 sign never
          key="$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"
          scripts/make-test-packages.sh "$RUNNER_TEMP/packages"
          GPG_KEY_ID="$key" GPG_PASSPHRASE_FILE="$RUNNER_TEMP/passphrase" \
            scripts/build-site.sh "$RUNNER_TEMP/packages" "$RUNNER_TEMP/site"
          site="$RUNNER_TEMP/site"
          # apt and dnf: signed, and the files that add them are there.
          gpg --verify "$site/apt/dists/stable/Release.gpg" "$site/apt/dists/stable/Release"
          gpg --verify "$site/apt/dists/stable/InRelease"
          for dir in "$site"/rpm/*/; do
            gpg --verify "$dir/repodata/repomd.xml.asc" "$dir/repodata/repomd.xml"
          done
          test -s "$site/futab.sources" && test -s "$site/futab.repo" && test -s "$site/index.html"
          grep -q "$key" "$site/index.html"
          # Flatpak: the test plugin's extension is in it, signed; no FuTab
          # bundle, so no .flatpakref.
          ostree --repo="$site/flatpak/repo" refs | grep -qx "runtime/io.github.purpleicon.FuTab.Plugin.test/$(uname -m)/stable"
          test -s "$site/flatpak/repo/summary.sig"
          grep -q '^GPGKey=' "$site/flatpak/futab.flatpakrepo"
          test ! -e "$site/flatpak/io.github.purpleicon.FuTab.flatpakref"
      - name: Install from it with apt and dnf
        run: scripts/test-install.sh "$RUNNER_TEMP/site" futab-test /usr/lib/futab/plugins/test.oxp
      - name: Install an architecture-independent package from it
        run: scripts/test-install.sh "$RUNNER_TEMP/site" futab-testall /usr/share/futab-testall/hello

  ci-success:
    name: ci-success
    if: always()
    needs: [shellcheck, dco, repositories]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # 'skipped' is fine: the sign-off check runs on pull requests only.
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
